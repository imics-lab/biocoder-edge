# BioCoder-Edge Docker Compose Configuration - Generic GPU Variant
# This file is for running BioCoder-Edge on any NVIDIA GPU-enabled machine with CUDA support
# Both main.py and stream_server.py run automatically in a single container
# Useful for desktop/server machines with NVIDIA GPUs (RTX, Tesla, etc.)
#
# Prerequisites:
#   - NVIDIA Docker runtime installed (nvidia-docker2)
#   - NVIDIA Container Toolkit configured
#   - NVIDIA GPU driver supporting CUDA 11.x (R520+)
#
# Note on Hardware Acceleration:
#   - Jetson-specific hardware video decode (nvvidconv, nvv4l2decoder) is not available
#   - Video decoding will use CPU (software fallback), which is acceptable on x86_64
#   - GPU is still fully utilized for YOLO inference
#
# Usage:
#   Build and start: docker compose -f docker-compose-gpu.yml up --build -d
#   View logs:       docker compose -f docker-compose-gpu.yml logs -f
#   Stop:            docker compose -f docker-compose-gpu.yml down
#   Stop & clean:    docker compose -f docker-compose-gpu.yml down -v

services:
  biocoder-edge:
    # Service name for the main application
    container_name: biocoder-edge-gpu

    # Build configuration with NVIDIA PyTorch CUDA base image
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Use NVIDIA NGC PyTorch image compatible with Pascal (sm_61) GPUs
        # PyTorch 1.13.1 + CUDA 11.x + cuDNN 8.x
        # Change this to the latest version of the image if you have a newer GPU
        BASE_IMAGE: nvcr.io/nvidia/pytorch:22.12-py3
        # Use the latest version of the image if you have a newer GPU
        # BASE_IMAGE: nvcr.io/nvidia/pytorch:24.12-py3

    # Image name after building
    image: biocoder-edge-gpu:latest

    # Override the default CMD with the entrypoint script
    # This runs both main.py and stream_server.py automatically
    entrypoint: ["/app/docker-entrypoint.sh"]

    # Restart policy - automatically restart if container stops
    restart: unless-stopped

    # Volume mappings - mount host directories into container
    volumes:
      # Configuration file (REQUIRED - edit this file with your settings)
      - ./config/config.yaml:/app/config/config.yaml:ro

      # Environment variables (REQUIRED - contains credentials and hardware settings)
      - ./.env:/app/.env:ro

      # Model weights (REQUIRED - your trained YOLO model)
      - ./model_weight:/app/model_weight:ro

      # SSH key for remote access (OPTIONAL - only needed for SFTP uploads)
      # Uncomment and adjust the path to match your SSH private key location
      # Note: Do NOT use :ro flag - entrypoint needs to fix permissions
      # Example: - ~/.ssh/id_rsa:/home/biocoder/.ssh/id_rsa
      # - ~/.ssh/your_key:/home/biocoder/.ssh/your_key

      # Data directories for output and uploads
      - ./data/pending_upload:/app/data/pending_upload
      - ./data/uploaded:/app/data/uploaded

      # Logs directory for persistent logging
      - ./logs:/app/logs

      # Shared memory for live view feature (Linux systems)
      # - /dev/shm:/dev/shm

      # Temporary directory for large event processing
      - biocoder-temp:/tmp/biocoder_edge_temp

    # Device mappings - grant container access to hardware
    devices:
      # USB Camera creates multiple video devices - map all of them
      # Adjust these based on your camera setup
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      # Uncomment additional video devices if needed:
      # - /dev/video4:/dev/video4

    # Port mappings
    ports:
      # Port for live view web server
      - "8080:8080"

    # Environment variables for GPU support
    environment:
      # Timezone
      - TZ=UTC

      # Python environment
      - PYTHONUNBUFFERED=1

      # NVIDIA GPU configuration
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video

      # CUDA environment variables
      - CUDA_VISIBLE_DEVICES=0

    # Shared memory size - important for GPU operations
    shm_size: '2g'

    # Runtime configuration for NVIDIA GPU
    runtime: nvidia

    # Deploy configuration for GPU resource reservation
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]

    # Network mode
    network_mode: bridge

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check - verify both processes are running
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f 'python.*main.py' && pgrep -f 'python.*stream_server.py'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# Named volumes
volumes:
  biocoder-temp:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g

# Networks
networks:
  default:
    driver: bridge

